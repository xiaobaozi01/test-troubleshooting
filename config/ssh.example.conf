# Copy the Host blocks you need into Windows %USERPROFILE%\.ssh\config.
# These are documentation-only addresses. Replace them with company values.
Host qa-order
    HostName 192.0.2.10
    User YOUR_SSH_USER
    Port 22
    IdentityFile ~/.ssh/YOUR_EXISTING_PRIVATE_KEY
    IdentitiesOnly yes

Host qa-stock
    HostName 192.0.2.20
    User YOUR_SSH_USER
    Port 22
    IdentityFile ~/.ssh/YOUR_EXISTING_PRIVATE_KEY
    IdentitiesOnly yes

# If you already use a jump host, reuse its existing SSH configuration.
# Add ProxyJump YOUR_JUMP_HOST_ALIAS to the required Host block.
