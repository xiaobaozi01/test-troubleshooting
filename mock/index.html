<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>排障助手 · 模拟测试群</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#24354c;background:#f4f6f9}*{box-sizing:border-box}body{margin:0}header{padding:24px 32px;background:#fff;border-bottom:1px solid #dfe5ec;display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:22px;margin:0 0 6px}p{margin:0;color:#62738a;font-size:13px}.badge{font-size:12px;background:#edf1f6;border-radius:20px;padding:8px 12px;white-space:nowrap}.badge.ready{background:#e0f3e9;color:#1d6b44}main{max-width:1400px;margin:auto;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:20px;padding:24px}.panel{background:#fff;border:1px solid #dfe5ec;border-radius:14px;overflow:hidden}.title{padding:16px 20px;border-bottom:1px solid #edf0f5;font-weight:600;font-size:14px}.messages{height:48vh;min-height:300px;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:16px}.message{max-width:94%;align-self:flex-start}.message.bot{align-self:flex-end}.meta{font-size:11px;color:#77879a;margin:0 0 5px}.bubble{background:#f0f3f7;border-radius:0 12px 12px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.7}.bot .bubble{background:#eaf3ff;border-radius:12px 0 12px 12px}.reply{border:0;background:none;color:#4675b4;padding:4px 0;cursor:pointer;font-size:11px}.composer{border-top:1px solid #edf0f5;padding:16px;display:grid;gap:10px}textarea{width:100%;min-height:82px;resize:vertical;border:1px solid #ccd6e3;border-radius:8px;padding:10px;font:13px system-ui}select,button{font:13px system-ui;padding:8px 12px;border:1px solid #ccd6e3;border-radius:7px;background:white;color:#344961;cursor:pointer}button.primary{background:#275fc7;color:white;border-color:#275fc7}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.hint{font-size:12px;color:#6c7d92}.tasks{padding:16px;max-height:75vh;overflow:auto}.task{border:1px solid #e0e7f0;border-radius:10px;padding:14px;margin-bottom:12px}.task-head{display:flex;justify-content:space-between;gap:8px;font-size:13px}.status{font-size:11px;color:#466eae;background:#edf3fc;padding:3px 7px;border-radius:10px}.task p{margin:10px 0;font-size:12px;line-height:1.6}details{font-size:12px;margin-top:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;line-height:1.5;background:#f6f8fb;padding:10px;border-radius:6px}.empty{color:#8391a4;font-size:13px;padding:24px;text-align:center}.error{color:#b53636;font-size:12px}footer{padding:0 26px 20px;text-align:center;color:#8290a1;font-size:12px}@media(max-width:800px){main{grid-template-columns:1fr;padding:12px}header{padding:18px}.messages{height:45vh}.tasks{max-height:none}}
</style></head><body>
<header><div><h1>测试群排障助手</h1><p>本机模拟环境 · DeepSeek Harness 驱动 · 所有服务及日志均为测试样例</p></div><a href="/deploy" target="_blank" rel="noopener" style="font-size:13px">打开模拟部署后台</a><span class="badge" id="runtime">正在检查插件…</span></header>
<main><section class="panel"><div class="title">测试群 · qa-test</div><div class="messages" id="messages"></div><form class="composer" id="form"><div class="row"><select id="sender"><option value="tester">测试人员</option><option value="developer-me">开发（你）</option></select><label class="hint"><input type="checkbox" id="mention" checked> @开发</label><span class="hint" id="replying"></span><button type="button" id="clear">取消引用</button></div><textarea id="text" placeholder="描述问题，或引用助手的追问补充信息"></textarea><div class="row"><button class="primary" type="submit">发送消息</button><button type="button" id="scenario">模拟：截图报错</button><button type="button" id="details">填入接口与时间</button><button type="button" id="partner">模拟：三方地址异常</button><span class="hint">仅向本机模拟接口发送</span></div><div class="error" id="error"></div></form></section>
<aside class="panel"><div class="title">排障任务与查询证据</div><div class="tasks" id="tasks"></div></aside></main><footer>默认每 10 秒拉取新消息；没有新任务时不调用模型。暂停 / 继续 / 结束：切换为开发身份并引用任务消息。</footer>
<script>
let replyTo=null, messages=[],lastVersion=''; const $=id=>document.getElementById(id);
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
const labels={queued:'排队',running:'排查中',awaiting_input:'等待补充',awaiting_confirmation:'等待开发确认修复',diagnosed:'已给出诊断',failed:'需要接管',paused:'已暂停',closed:'已结束'};
function quote(id){replyTo=id;$('mention').checked=false;$('replying').textContent='正在回复 '+id;$('text').focus()}
async function send(input){const r=await fetch('/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(input)});const v=await r.json();if(!r.ok)throw Error(v.error);return v}
function reset(){replyTo=null;$('replying').textContent='';$('text').value='';$('error').textContent=''}
$('clear').onclick=()=>{replyTo=null;$('replying').textContent=''};
$('form').onsubmit=async e=>{e.preventDefault();try{await send({text:$('text').value,senderId:$('sender').value,mentions:$('mention').checked?['developer-me']:[],replyTo});reset();await refresh()}catch(e){$('error').textContent=e.message}};
$('scenario').onclick=async()=>{try{await send({text:'@开发 测试环境提交订单失败，页面提示 ORDER_CREATE_FAILED，帮忙看一下。[模拟截图]',mentions:['developer-me'],attachments:[{id:'demo-error',name:'订单报错.png'}]});await refresh()}catch(e){$('error').textContent=e.message}};
const faqButton=el('button','','模拟：常见问题咨询');faqButton.type='button';$('partner').after(faqButton);
faqButton.onclick=async()=>{try{await send({text:'@开发 只咨询演示文档：DEMO_ACCOUNT_LOCKED 应该怎么处理？请引用适用条件和复验步骤。这是资料问答，不是正在发生的故障。',mentions:['developer-me']});await refresh()}catch(e){$('error').textContent=e.message}};
const repairButton=el('button','','模拟：申请配置修复');repairButton.type='button';repairButton.hidden=true;faqButton.after(repairButton);
repairButton.onclick=async()=>{try{await send({text:'@开发 test 环境 GET /api/partner/status 调三方失败，时间 2026-11-09T03:00:00+08:00，traceId=demo-partner-202。请按文档和实际证据诊断，若属于允许修复的问题则提出精确修改发布方案，等待我确认，现在不要修改。',mentions:['developer-me']});await refresh()}catch(e){$('error').textContent=e.message}};
$('partner').onclick=async()=>{try{await send({text:'@开发 test 环境 GET /api/partner/status 调三方失败，时间 2026-11-09T03:00:00+08:00，traceId=demo-partner-202。请查日志、代码和接入约定，并登录部署后台查看 YAML 核对三方地址，不修改或发布。',mentions:['developer-me']});await refresh()}catch(e){$('error').textContent=e.message}};
$('details').onclick=()=>{const bot=[...messages].reverse().find(m=>m.senderId==='troubleshooting-bot');if(bot)quote(bot.id);$('text').value='失败接口 POST /api/orders，测试环境 test，发生时间 2026-11-09 02:00:00 +08:00。请求 ID：demo-order-101。商品 SKU-DEMO-1。';};
async function refresh(){try{const r=await fetch('/snapshot');if(!r.ok)throw Error('模拟接口不可用');const s=await r.json();messages=s.messages;repairButton.hidden=!s.runtime.repairEnabled;$('runtime').textContent=s.runtime.ready?'Harness 已连接 · '+s.runtime.model.model:(s.runtime.error||'等待 Harness 插件启动');$('runtime').className='badge'+(s.runtime.ready?' ready':'');const version=JSON.stringify(s);if(version===lastVersion)return;lastVersion=version;
const nearBottom=$('messages').scrollHeight-$('messages').scrollTop-$('messages').clientHeight<80;$('messages').replaceChildren();if(!messages.length)$('messages').append(el('div','empty','点击“模拟：截图报错”开始一次排障'));
for(const m of messages){const n=el('div','message'+(m.senderId==='troubleshooting-bot'?' bot':''));n.append(el('div','meta',(m.senderId==='tester'?'测试人员':m.senderId==='developer-me'?'开发（你）':'AI 排障助手')+' · '+m.id+(m.replyTo?' · 回复 '+m.replyTo:'')));const text=m.text+(m.attachments?.length?'\n📎 '+m.attachments.map(a=>a.name).join(', '):'');const bubble=el('div','bubble',text.includes('排障结果')&&text.length>900?text.split('\n\n已确认事实')[0]:text);if(text.includes('排障结果')&&text.length>900){const full=el('details');full.append(el('summary','','展开完整证据与处理建议'),el('pre','',text));bubble.append(full)}n.append(bubble);const b=el('button','reply','引用回复');b.onclick=()=>quote(m.id);n.append(b);const approval=m.senderId==='troubleshooting-bot'&&m.text.includes('待确认修复')&&/\/确认修复 (R-[a-f0-9]{12})/.exec(m.text);if(approval){const a=el('button','reply','填入确认指令');a.onclick=()=>{$('sender').value='developer-me';quote(m.id);$('text').value='/确认修复 '+approval[1]};n.append(a)}$('messages').append(n)}if(nearBottom)$('messages').scrollTop=$('messages').scrollHeight;
$('tasks').replaceChildren();if(!s.tasks.length)$('tasks').append(el('div','empty','收到 @开发 的消息后会自动创建任务'));
for(const t of [...s.tasks].reverse()){const n=el('div','task'),h=el('div','task-head');h.append(el('strong','',t.id),el('span','status',labels[t.status]||t.status));n.append(h,el('p','',t.messages[0]?.text||''),el('p','hint','工具调用 '+t.calls.length+' 次 · 证据 '+Object.keys(t.evidence).length+' 条'));if(t.error)n.append(el('p','error',t.error));const group=el('details');group.append(el('summary','','查询证据（'+Object.keys(t.evidence).length+'）'));for(const e of Object.values(t.evidence)){const d=el('details');d.append(el('summary','',e.id+' · '+e.kind+' · '+(e.args.service||'目录')),el('pre','',JSON.stringify(e.result,null,2)));group.append(d)}n.append(group);const d=el('details');d.append(el('summary','','查询轨迹'),el('pre','',JSON.stringify(t.calls,null,2)));n.append(d);$('tasks').append(n)}}catch(e){$('runtime').textContent='连接中断：'+e.message;$('runtime').className='badge'}}
refresh();setInterval(refresh,1000);
</script></body></html>
